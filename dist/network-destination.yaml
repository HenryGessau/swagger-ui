swagger: "2.0"
host: localhost
basePath: /v1
tags:
- name: destination

paths:
  /destination:
    post:
      tags:
      - destination
      operationId: createDestination
      summary: Create a network destination.
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Destination'

definitions:

  CIDR:
    type: string
    description: An IP address range in CIDR notation.
    oneOf:
    - $ref: '#/definitions/CIDRv4'
    - $ref: '#/definitions/CIDRv6'

  CIDRv4:
    type: string
    description: An IPv4 address range in CIDR notation.
    pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(3[0-2]|[1-2][0-9]|[0-9]))$'
    example: 10.9.8.0/24

  CIDRv6:
    type: string
    description: An IPv6 address range in CIDR notation.
    pattern: '^(?:(?:(?:[a-f0-9]{1,4}:){6}|(?=(?:[a-f0-9]{0,4}:){0,6}(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![:.\w]))(([0-9a-f]{1,4}:){0,5}|:)((:[0-9a-f]{1,4}){1,5}:|:)|::(?:[a-f0-9]{1,4}:){5})(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)|(?:[a-f0-9]{1,4}:){7}[a-f0-9]{1,4}|(?=(?:[a-f0-9]{0,4}:){0,7}[a-f0-9]{0,4}(?![:.\w]))(([0-9a-f]{1,4}:){1,7}|:)((:[0-9a-f]{1,4}){1,7}|:)|(?:[a-f0-9]{1,4}:){7}:|:(:[a-f0-9]{1,4}){7})(?![:.\w])\/(?:12[0-8]|1[01][0-9]|[1-9]?[0-9])$'
    example: 2001:DB8:8700:2010::/64

  IP:
    type: string
    description: An IP address.
    oneOf:
    - $ref: '#/definitions/IPv4'
    - $ref: '#/definitions/IPv6'

  IPv4:
    type: string
    description: An IPv4 address.
    pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$'
    minLength: 7
    maxLength: 15
    example: 192.168.3.4

  IPv6:
    type: string
    description: An IPv6 address.
    minLength: 2   # ::
    maxLength: 45  # 0000:0000:0000:0000:0000:ffff:192.168.100.228
    # Adapted from https://regex101.com/library/o6qEkY?!\S
    pattern: '^(?:(?:(?:[a-f0-9]{1,4}:){6}|(?=(?:[a-f0-9]{0,4}:){0,6}(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![:.\w]))(([0-9a-f]{1,4}:){0,5}|:)((:[0-9a-f]{1,4}){1,5}:|:)|::(?:[a-f0-9]{1,4}:){5})(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)|(?:[a-f0-9]{1,4}:){7}[a-f0-9]{1,4}|(?=(?:[a-f0-9]{0,4}:){0,7}[a-f0-9]{0,4}(?![:.\w]))(([0-9a-f]{1,4}:){1,7}|:)((:[0-9a-f]{1,4}){1,7}|:)|(?:[a-f0-9]{1,4}:){7}:|:(:[a-f0-9]{1,4}){7})$'
    example: '2001:db8:85a3::8a2e:370:7301'

  IPOrCIDR:
    type: string
    description: An IP address or a range of IP addresses in CIDR notation.
    allOf:
    - $ref: '#/definitions/IP'
    - $ref: '#/definitions/CIDR'

  Destination:
    type: object
    required:
    - destination
    properties:
      destination:
        $ref: '#/definitions/IPOrCIDR'
