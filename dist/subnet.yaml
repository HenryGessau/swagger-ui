# swagger: "2.0"
openapi: 3.1.0
info:
  version: "1.0.0"
  title: Subnet API
tags:
- name: subnets

paths:
  /subnets:
    post:
      tags:
      - subnets
      operationId: createSubnet
      summary: Create a subnet
      requestBody:
        description: |-
          The backup policy prototype object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubnetPrototype'
      responses:
        400:
          description: Bad Request

components:
  schemas:
    CIDRv4:
      type: string
      description: An IPv4 address range in CIDR notation.
      pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(3[0-2]|[1-2][0-9]|[0-9]))$'
      example: 10.9.8.0/24
    CIDRv6:
      type: string
      description: An IPv6 address range in CIDR notation.
      pattern: '^(?:(?:(?:[a-f0-9]{1,4}:){6}|(?=(?:[a-f0-9]{0,4}:){0,6}(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![:.\w]))(([0-9a-f]{1,4}:){0,5}|:)((:[0-9a-f]{1,4}){1,5}:|:)|::(?:[a-f0-9]{1,4}:){5})(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)|(?:[a-f0-9]{1,4}:){7}[a-f0-9]{1,4}|(?=(?:[a-f0-9]{0,4}:){0,7}[a-f0-9]{0,4}(?![:.\w]))(([0-9a-f]{1,4}:){1,7}|:)((:[0-9a-f]{1,4}){1,7}|:)|(?:[a-f0-9]{1,4}:){7}:|:(:[a-f0-9]{1,4}){7})(?![:.\w])\/(?:12[0-8]|1[01][0-9]|[1-9]?[0-9])$'
      example: 2001:DB8:8700:2010::/64
    SubnetCIDR:
      type: string
      oneOf:
      - $ref: '#/components/schemas/CIDRv4'
      - $ref: '#/components/schemas/CIDRv6'
    SubnetPrototype:
      type: object
      required:
      - cidr
      properties:
        cidr:
          $ref: '#/components/schemas/SubnetCIDR'
